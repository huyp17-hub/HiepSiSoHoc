      <div class="bar mhp"><i style="width:calc(${q/DUEL_HP*100}% - 6px)"></i></div></div></div></div>`;
}
function nextDuelRound(){
  if (D.over) return;
  if (D.idx >= D.qs.length || D.hp[0] <= 0 || D.hp[1] <= 0) return endDuel();
  const q = D.qs[D.idx];
  // bot decides when and what it answers
  const t = Math.max(1.8, D.opp.mean + (Math.random() - .5) * 5);
  D.round = { q, start:Date.now(), me:null, botAt:(t + (isInput(q) ? 2.5 : 0)) * 1000, botRight:Math.random() < D.opp.acc, botDone:false, ended:false };
  D.elim = []; D.shieldOn = D.shieldOn && true;
  drawDuelRound();
  clearInterval(duelTick); duelTick = setInterval(duelLoop, 100);
}
function drawDuelRound(){
  const R = D.round, q = R.q;
  document.getElementById("dRound").textContent = `Câu ${D.idx + 1}/${D.qs.length}`;
  document.getElementById("dPlates").innerHTML = duelPlates();
  const canSkill = !R.ended && R.me === null && !D.skillUsed && !(save.cls === "mage" && !isInput(q) && D.elim.length >= 2);
  document.getElementById("dQ").innerHTML = `
    <article class="qpanel px">
      <div class="qtext">${math(q.question)}</div>
      ${isInput(q) ? fillHtml(q, R.given ?? null, R.won ? "right" : R.me !== null ? "wrong" : "", "dAns", R.ended || R.me !== null)
        + (R.ended ? `<p class="rightans">Đáp án đúng: ${answerLine(q)}</p>` : "") : `
      <div class="opts">${q.options.map((o, i) => {
        let cls = "";
        if (R.ended) { if (i === q.correctIndex) cls = "right"; else if (i === R.me) cls = "wrong"; }
        else if (R.me === i) cls = "wrong";
        const gone = D.elim.includes(i) && !R.ended;
        return `<button class="opt ${cls} ${gone ? "gone" : ""}" data-i="${i}" ${R.ended || R.me !== null || gone ? "disabled" : ""}><span class="l">${"ABCD"[i]}</span><span class="t">${math(stripLetter(o))}</span></button>`;
      }).join("")}</div>`}
      ${R.reveal ? `<div class="hintbox">${spr(130,"s2")}<span>${esc(R.reveal)}</span></div>` : ""}
      <div class="below">
        <button class="btn ghost potion ${D.shieldOn ? "skill active" : ""}" id="dSkill" ${canSkill ? "" : "disabled"}>${spr(heroCls().skillIcon,"s2")}${D.shieldOn ? "Khiên đang bật" : heroCls().skill}</button>
        <span class="note" id="dNote">${R.ended ? R.msg : R.me !== null ? "Bạn đã trả lời sai, chờ đối thủ..." : "Ai đúng trước sẽ ra đòn!"}</span>
      </div>
    </article>`;
  app.querySelectorAll("#dQ .opt").forEach(b => b.onclick = () => duelAnswer(+b.dataset.i));
  if (isInput(q) && !R.ended && R.me === null) bindFill(q, duelSubmit, "dAns");
  const sk = document.getElementById("dSkill"); if (sk) sk.onclick = duelSkill;
}
function duelLoop(){
  if (!D || screen !== "duel" || D.over) return clearInterval(duelTick);
  const R = D.round; if (R.ended) return;
  const el = Date.now() - R.start, left = Math.max(0, DUEL_TIME * 1000 - el);
  const bar = document.getElementById("tbar"); if (bar) bar.style.width = (left / (DUEL_TIME * 1000) * 100) + "%";
  if (!R.botDone && el >= R.botAt) {
    R.botDone = true;
    if (R.botRight) return endRound("opp", el);
    setStatus("Đối thủ trả lời sai!");
    if (R.me !== null) return endRound("none");
  }
  if (left <= 0) endRound("none");
}
function setStatus(t){ const s = document.getElementById("oppStatus"); if (s) { s.textContent = t; replay(s, "pop", 900); } }
function duelAnswer(i){
  const R = D && D.round; if (!R || R.ended || R.me !== null) return;
  if (i === R.q.correctIndex) { clearMistake(R.q); return endRound("me", Date.now() - R.start); }
  R.me = i; noteMistake(R.q); Sound.play("wrong");
  if (R.botDone) return endRound("none");
  drawDuelRound();
}
function duelSubmit(v){
  const R = D && D.round; if (!R || R.ended || R.me !== null) return;
  const val = String(v || "").trim();
  if (!val) { replay(document.getElementById("dAns"), "nudge", 400); Sound.play("bump"); return; }
  R.given = val;
  if (checkInput(R.q, val)) { R.won = true; clearMistake(R.q); return endRound("me", Date.now() - R.start); }
  R.me = -1; noteMistake(R.q); Sound.play("wrong");
  if (R.botDone) return endRound("none");
  drawDuelRound();
}
function duelSkill(){
  const R = D.round; if (R.ended || R.me !== null || D.skillUsed) return;
  D.skillUsed = true;
  if (save.cls === "mage" && isInput(R.q)) { R.reveal = revealHint(R.q); Sound.play("heal"); popText(document.getElementById("player"), "Tiên Tri!", "heal"); }
  else if (save.cls === "mage") {
    const w = shuffle(R.q.options.map((_, i) => i).filter(i => i !== R.q.correctIndex && !D.elim.includes(i)));
    if (w.length) D.elim.push(w[0]); Sound.play("heal"); popText(document.getElementById("player"), "Tiên Tri!", "heal");
  } else { D.shieldOn = true; Sound.play("door"); popText(document.getElementById("player"), "Khiên Thần!", "heal"); }
  drawDuelRound();
}
function endRound(winner, ms){
  const R = D.round; if (R.ended) return; R.ended = true; clearInterval(duelTick);
  const dmg = ms != null ? 20 + Math.round(10 * Math.max(0, DUEL_TIME * 1000 - ms) / (DUEL_TIME * 1000)) : 0;
  const pEl = document.getElementById("player"), mEl = document.getElementById("monster");
  if (winner === "me") {
    D.myCorrect++;
    if (D.oppShield && D.opp.cls === "knight" && Math.random() < .5) { D.oppShield = false; R.msg = `Bạn đúng trước, nhưng đối thủ dùng Khiên Thần chặn đòn!`; Sound.play("bump"); popText(mEl, "Chặn!", "heal"); }
    else { D.hp[1] -= dmg; R.msg = `Bạn đúng trước sau ${(ms/1000).toFixed(1)} giây! Gây ${dmg} sát thương.`; Sound.play("correct"); strikeDuel(pEl, mEl, dmg, save.cls === "mage"); }
  } else if (winner === "opp") {
    D.oppCorrect++;
    if (D.shieldOn) { D.shieldOn = false; R.msg = "Đối thủ đúng trước, nhưng Khiên Thần của bạn đã chặn đòn!"; Sound.play("bump"); popText(pEl, "Chặn!", "heal"); }
    else { D.hp[0] -= dmg; R.msg = `Đối thủ đúng trước sau ${(ms/1000).toFixed(1)} giây! Bạn mất ${dmg} máu.`; Sound.play("hurt"); strikeDuel(mEl, pEl, dmg, D.opp.cls === "mage", true); }
    if (R.me === null) D.log.push(R.q);
  } else {
    R.msg = "Không ai trả lời đúng. Hòa câu này!"; Sound.play("bump");
    if (R.me !== null || !D.log.includes(R.q)) D.log.push(R.q);
  }
  if (R.me !== null && !D.log.includes(R.q)) D.log.push(R.q);
  drawDuelRound();
  setTimeout(() => { if (D && screen === "duel") { D.idx++; nextDuelRound(); } }, 2600);
}
function strikeDuel(from, to, dmg, magic, incoming){
  replay(from, magic ? "cast" : (incoming ? "lunge" : "attack"), 450);
  if (magic && !reduceMotion()) {
    const ar = document.getElementById("arena"), b = document.createElement("span");
    b.className = "bolt" + (incoming ? " rev" : ""); ar.appendChild(b); setTimeout(() => b.remove(), 500);
  }
  setTimeout(() => {
    replay(to, incoming ? "wounded" : "struck", 550);
    popText(to, "-" + dmg, incoming ? "hurt" : "hit"); particles(to, incoming ? "#E84537" : "#F7C282", 10); shake();
    if (incoming) replay(document.getElementById("arena"), "bleed", 500);
  }, magic ? 330 : 180);
  document.getElementById("dPlates").innerHTML = duelPlates();
}
function endDuel(){
  if (D.over) return; D.over = true; clearInterval(duelTick);
  const s = duelSave();
  const result = D.hp[0] <= 0 ? "lose" : D.hp[1] <= 0 ? "win" : D.hp[0] > D.hp[1] ? "win" : D.hp[0] < D.hp[1] ? "lose" : "draw";
  const delta = result === "win" ? 25 : result === "lose" ? -15 : 0;
  const gold = result === "win" ? 30 : result === "draw" ? 15 : 10;
  const before = rankOf(s.rating).name;
  s.rating = Math.max(800, s.rating + delta); s[result === "win" ? "w" : result === "lose" ? "l" : "d"]++;
  save.gold += gold; persist();
  const after = rankOf(s.rating).name;
  setTimeout(() => wipe(() => {
    screen = "duel-end"; Sound.stopMusic(); Sound.play(result === "lose" ? "lose" : "win");
    app.innerHTML = `
      <section class="result ${result === "lose" ? "lose" : ""}">
        <div class="hero">${result === "lose" ? skinSpr(D.opp.skin,"s8") : heroSpr("s8")}</div>
        <h2>${result === "win" ? "Chiến thắng!" : result === "lose" ? "Thất bại!" : "Hòa!"}</h2>
        <p class="sub">Bạn ${D.myCorrect} câu đúng trước, ${esc(D.opp.name)} ${D.oppCorrect} câu. Máu còn lại ${Math.max(0,D.hp[0])} so với ${Math.max(0,D.hp[1])}.</p>
        ${after !== before ? `<div class="record">${delta > 0 ? "Thăng hạng" : "Xuống hạng"}: ${after}!</div>` : ""}
        <div class="stats">
          <div class="stat px"><b>${delta > 0 ? "+" : ""}${delta}</b><span>Điểm solo (${s.rating})</span></div>
          <div class="stat px"><b>+${gold}</b><span>Vàng</span></div>
        </div>
        <div class="center">
          <button class="btn primary" id="again">Đấu trận nữa</button>
          <button class="btn ghost" id="toMap">Về bản đồ</button>
        </div>
        ${D.log.length ? reviewList("Các câu bạn chưa trả lời đúng", D.log) : ""}
      </section>`;
    document.getElementById("again").onclick = () => wipe(startMatchmaking);
    document.getElementById("toMap").onclick = () => wipe(() => renderMap("duel"));
    window.scrollTo(0,0);
    if (result === "win") try { if (!reduceMotion() && window.confetti) confetti({shapes:["square"], particleCount:100, spread:80, origin:{y:.5}, colors:["#F7C282","#43E1B3","#E84537"]}); } catch(e){}
  }), 1400);
}

// =====================================================================
//  INPUT
// =====================================================================
const KEYDIR = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0]};
document.addEventListener("keydown", e => {
  Sound.init();
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  if (Dialog.active) {
    if ([" ", "Enter", "z", "Z", "x", "X"].includes(e.key)) { e.preventDefault(); Dialog.advance(); }
    return;
  }
  if (screen === "room") {
    const d = KEYDIR[e.key] || KEYDIR[e.key.toLowerCase()];
    if (d) { e.preventDefault(); tryMove(d[0], d[1]); }
    return;
  }
  if (screen === "duel" && D && D.round && !D.round.ended) {
    if (isInput(D.round.q)) { const el = document.getElementById("dAns"); if (el && !el.readOnly && e.key.length === 1) el.focus(); return; }
    const map = {"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3}, k = e.key.toLowerCase();
    if (k in map) { e.preventDefault(); duelAnswer(map[k]); } else if (k === "k") duelSkill();
    return;
  }
  if (screen === "battle" && B && B.ready && !document.querySelector(".overlay")) {
    const k = e.key.toLowerCase();
    const map = {"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
    const cq = B.queue[B.idx], fillMode = isInput(cq) && !B.mc;
    if (fillMode && !B.answered) { const el = document.getElementById("ans"); if (el && e.key.length === 1 && FILL_ALLOWED[cq.answerKind].test(e.key)) { el.focus(); } return; }
    if (!B.answered && k in map && map[k] < cq.options.length) { e.preventDefault(); answer(map[k]); }
    else if (!B.answered && k === "h") document.getElementById("hint")?.click();
    else if (!B.answered && k === "p") drinkPotion();
    else if (!B.answered && k === "e") useElixir();
    else if (!B.answered && k === "k") useSkill();
  }
});
document.addEventListener("pointerdown", () => Sound.init(), {once:true});

if (SHEET_IMG.complete && SHEET_IMG.naturalWidth) renderTitle(); else SHEET_IMG.addEventListener("load", renderTitle, {once:true});

</script>
